[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-ai-toolkit"
version = "0.1.0"
description = "Sorts a shoot into five piles and says what each photograph becomes after a normal edit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "openai>=1.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Semantic near-duplicate and diversity similarity: a CLIP image tower run
# locally through ONNX Runtime. An extra rather than a dependency on purpose --
# without it the tool groups by perceptual hash, which is what it always did,
# and says so in the run summary. See `photoai models` and src/photoai/embeddings.py.
embeddings = [
    "onnxruntime>=1.17",
]

[project.scripts]
photoai = "photoai.cli:main"

[tool.setuptools]
packages = ["photoai", "photoai.exporters", "photoai.renderers"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
photoai = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
